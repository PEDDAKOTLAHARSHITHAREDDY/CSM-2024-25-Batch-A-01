{% extends "base.html" %}

{% block content %}
<div class="main-container">
    <h1 class="hero-title">Logged Out</h1>
    
    <div style="text-align: center; margin: 30px 0;">
        <p style="color: #555; font-size: 1.1rem; line-height: 1.6;">
            You have been successfully logged out.
        </p>
        
        <div style="display: flex; justify-content: center; gap: 20px; margin-top: 30px;">
            <a href="{% url 'login' %}" class="btn-primary" style="padding: 10px 25px;">
                Log in again
            </a>
            <a href="{% url 'home' %}" class="btn-primary" style="padding: 10px 25px;">
                Return to home page
            </a>
        </div>
    </div>
</div>
{% endblock %}
